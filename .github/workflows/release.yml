name: Release

on:
  push:
    tags:
      - 'v*' # Trigger workflow when a tag starting with 'v' is pushed (e.g., v1.0.0, v2.0.2)

jobs:
  release:
    runs-on: windows-latest
    
    # Required to allow the workflow to create releases and upload assets
    permissions:
      contents: write 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Use an appropriate Node.js version
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Update package.json Version and Push
        shell: bash
        run: |
          # Strip 'v' from the tag (e.g., 'v2.0.2' -> '2.0.2')
          VERSION=${GITHUB_REF_NAME#v}
          
          # Update package.json and package-lock.json
          npm version $VERSION --no-git-tag-version --allow-same-version
          
          # Commit and push the updated files back to the main branch if they changed
          if [[ -n $(git status --porcelain) ]]; then
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add package.json package-lock.json
            git commit -m "chore: bump version to $GITHUB_REF_NAME [skip ci]"
            git push origin HEAD:main
          else
            echo "Version is already up to date, skipping commit."
          fi

      - name: Build Application and Setup Binary
        # Run electron-vite build and then electron-builder with publish set to never
        # (This prevents electron-builder from failing when it detects a CI environment without a GH_TOKEN)
        run: npm run build && npx electron-builder --win --config -p never

      - name: Create GitHub Release and Upload Binary
        uses: softprops/action-gh-release@v2
        with:
          # Use the RELEASE_NOTES.md file for the release notes
          body_path: RELEASE_NOTES.md
          # Grab any executable file generated in the dist folder
          files: |
            dist/*.exe
