name: Release

on:
  push:
    tags:
      - 'v*' # Trigger workflow when a tag starting with 'v' is pushed (e.g., v1.0.0, v2.0.2)

jobs:
  release:
    runs-on: windows-latest
    
    # Required to allow the workflow to create releases and upload assets
    permissions:
      contents: write 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Use an appropriate Node.js version
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Update package.json Version and Push
        run: |
          # Strip 'v' from the tag (e.g., 'v2.0.2' -> '2.0.2')
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          
          # Update package.json and package-lock.json
          npm version $version --no-git-tag-version
          
          # Commit and push the updated files back to the main branch
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add package.json package-lock.json
          git commit -m "chore: bump version to $env:GITHUB_REF_NAME [skip ci]"
          git push origin HEAD:main

      - name: Build Application and Setup Binary
        # Runs the command from your package.json which builds the vite app and runs electron-builder
        run: npm run build:win

      - name: Create GitHub Release and Upload Binary
        uses: softprops/action-gh-release@v2
        with:
          # Automatically generate release notes from PRs and commits since the last tag
          generate_release_notes: true
          # Grab any executable file generated in the dist folder
          files: |
            dist/*.exe
